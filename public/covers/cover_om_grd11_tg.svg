<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%" dir="rtl">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad_cover_om_grd11_tg_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="60%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Spine Shadow -->
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.65)" />
      <stop offset="4%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="7%" stop-color="rgba(0,0,0,0.4)" />
      <stop offset="12%" stop-color="rgba(0,0,0,0.05)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </linearGradient>

    <!-- Subtle Pattern -->
    <pattern id="islamicPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#facc15" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="20" cy="20" r="6" fill="none" stroke="#facc15" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Cover Rectangle -->
  <rect width="400" height="560" rx="16" fill="url(#bgGrad_cover_om_grd11_tg_svg)" />

  <!-- Background Pattern -->
  <rect width="400" height="560" rx="16" fill="url(#islamicPattern)" />

  <!-- Outer Decorative Border Frame -->
  <rect x="18" y="18" width="364" height="524" rx="12" fill="none" stroke="#facc15" stroke-opacity="0.3" stroke-width="1.5" />
  <rect x="24" y="24" width="352" height="512" rx="8" fill="none" stroke="#facc15" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6,4" />

  <!-- Corner Flourishes -->
  <g stroke="#facc15" stroke-width="2" fill="none" stroke-opacity="0.6">
    <path d="M 28 45 L 28 28 L 45 28" />
    <path d="M 372 45 L 372 28 L 355 28" />
    <path d="M 28 515 L 28 532 L 45 532" />
    <path d="M 372 515 L 372 532 L 355 532" />
  </g>

  <!-- Top Official Header -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif">
    <text x="200" y="55" font-size="12" font-weight="900" fill="#facc15" letter-spacing="1">
      سلطنة عُمان
    </text>
    <text x="200" y="74" font-size="11" font-weight="700" fill="#f8fafc" opacity="0.9">
      وزارة التربية والتعليم
    </text>
    <line x1="120" y1="84" x2="280" y2="84" stroke="#facc15" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <!-- Category & Grade Pill -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="30" rx="15" fill="#facc15" fill-opacity="0.2" stroke="#facc15" stroke-opacity="0.6" stroke-width="1" />
    <text x="100" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">
      دليل المعلم المعتمد
    </text>
  </g>

  
  <!-- Grade Level Banner -->
  <text x="200" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="url(#goldGrad)">
    ★ الصف الحادي عشر ★
  </text>

  <!-- Central Illustrated Medallion -->
  <circle cx="200" cy="270" r="62" fill="#030712" fill-opacity="0.45" stroke="#facc15" stroke-opacity="0.4" stroke-width="2" />
  <circle cx="200" cy="270" r="54" fill="none" stroke="#facc15" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4,4" />
  
        <!-- Graduation Cap Icon -->
        <g transform="translate(170, 240) scale(1.5)" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </g>

  <!-- Book Main Title Box -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif">
    
      <text x="200" y="390" font-size="21" font-weight="900" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">
        الجغرافيا والتقنيات الحديثة
      </text>
    

    <!-- Subtitle / Subject Info -->
    <text x="200" y="440" font-size="12" font-weight="600" fill="#cbd5e1" opacity="0.95">
      دليل المعلم والتطبيقات المعملية GIS
    </text>

    
    <!-- Author / Source -->
    <text x="200" y="465" font-size="11" font-weight="500" fill="#facc15" opacity="0.9">
      وزارة التربية والتعليم
    </text>
  </g>

  <!-- Bottom Official Stamp / Ribbon -->
  <g transform="translate(40, 485)">
    <rect x="0" y="0" width="320" height="34" rx="8" fill="#000000" fill-opacity="0.4" stroke="#facc15" stroke-opacity="0.3" stroke-width="1" />
    <text x="160" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">
      المكتبة الرقمية العمانية • مصرح ومطابق للمواصفات
    </text>
  </g>

  <!-- Left Side Spine 3D Effect for Realistic Book Feel -->
  <rect x="0" y="0" width="36" height="560" rx="16" fill="url(#spineShadow)" />
  <line x1="36" y1="0" x2="36" y2="560" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <line x1="38" y1="0" x2="38" y2="560" stroke="rgba(0,0,0,0.5)" stroke-width="1" />
</svg>