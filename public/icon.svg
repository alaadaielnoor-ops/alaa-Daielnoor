<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2e36"/>
      <stop offset="50%" stop-color="#0e4443"/>
      <stop offset="100%" stop-color="#05191d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer decorative orbit -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 8" opacity="0.45"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.3"/>

  <!-- Compass Cardinal points -->
  <polygon points="256,58 262,76 250,76" fill="#fbbf24"/>
  <polygon points="256,454 262,436 250,436" fill="#fbbf24"/>
  <polygon points="58,256 76,250 76,262" fill="#fbbf24"/>
  <polygon points="454,256 436,250 436,262" fill="#fbbf24"/>

  <!-- Open Book Symbol -->
  <g transform="translate(106, 170)">
    <!-- Book pages left -->
    <path d="M 150 160 C 100 130 30 135 10 150 L 10 30 C 35 15 100 10 150 40 Z" fill="#f8fafc" opacity="0.95"/>
    <path d="M 150 165 C 100 135 30 140 10 155 L 10 150 C 30 135 100 130 150 160 Z" fill="#94a3b8"/>
    <!-- Book pages right -->
    <path d="M 150 160 C 200 130 270 135 290 150 L 290 30 C 265 15 200 10 150 40 Z" fill="#f1f5f9" opacity="0.95"/>
    <path d="M 150 165 C 200 135 270 140 290 155 L 290 150 C 270 135 200 130 150 160 Z" fill="#cbd5e1"/>
    <!-- Book spine -->
    <path d="M 147 40 L 153 40 L 153 165 L 147 165 Z" fill="#0d9488"/>

    <!-- Map / Latitude lines on left page -->
    <path d="M 30 65 Q 80 50 130 75" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 30 95 Q 80 80 130 105" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 30 125 Q 80 110 130 135" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Educational Quill / Geometry / North Arrow on right page -->
    <path d="M 170 120 L 220 50 L 270 120 Z" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.8"/>
    <circle cx="220" cy="85" r="16" fill="none" stroke="#0d9488" stroke-width="2.5"/>
    <path d="M 180 138 Q 230 120 270 138" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Globe / Astrolabe core overlay -->
  <g transform="translate(256, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="48" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="0" cy="0" r="42" fill="#064e3b" />
    <!-- Meridians inside mini globe -->
    <ellipse cx="0" cy="0" rx="42" ry="18" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="18" ry="42" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <line x1="-42" y1="0" x2="42" y2="0" stroke="#fbbf24" stroke-width="2"/>
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#fbbf24" stroke-width="2"/>
    <!-- Glowing core star -->
    <circle cx="0" cy="0" r="6" fill="#fef08a"/>
  </g>

  <!-- Arabic Typography / Brand Icon banner -->
  <text x="256" y="405" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="1">
    المكتبة الذكية
  </text>
  <text x="256" y="435" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" fill="#fbbf24">
    جغرافيا • تربية • بحث واسترجاع
  </text>
</svg>
